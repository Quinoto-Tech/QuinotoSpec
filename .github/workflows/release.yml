name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Verify tag matches package version
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          VERSION_FILE="$(tr -d '[:space:]' < .version)"
          MANIFEST_VERSION="$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")"
          INSTALLER_VERSION="$(grep -o 'INSTALLER_VERSION="[0-9.]*"' install.sh | cut -d'"' -f2)"
          PLUGIN_VERSION="$(python3 -c 'import json; print(json.load(open(".cursor-plugin/plugin.json"))["version"])')"

          echo "Tag: $VERSION | .version: $VERSION_FILE | manifest.json: $MANIFEST_VERSION | install.sh: $INSTALLER_VERSION | cursor-plugin: $PLUGIN_VERSION"

          FAIL=0
          if [ "$VERSION" != "$VERSION_FILE" ]; then
            echo "ERROR: tag v$VERSION != .version ($VERSION_FILE)"
            FAIL=1
          fi
          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "ERROR: tag v$VERSION != manifest.json version ($MANIFEST_VERSION)"
            FAIL=1
          fi
          if [ "$VERSION" != "$INSTALLER_VERSION" ]; then
            echo "ERROR: tag v$VERSION != install.sh INSTALLER_VERSION ($INSTALLER_VERSION)"
            FAIL=1
          fi
          if [ "$VERSION" != "$PLUGIN_VERSION" ]; then
            echo "ERROR: tag v$VERSION != .cursor-plugin/plugin.json version ($PLUGIN_VERSION)"
            FAIL=1
          fi
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md has no entry for $VERSION — run scripts/update-version.sh first"
            FAIL=1
          fi
          exit $FAIL

      - name: Determine prerelease status
        id: release
        run: |
          STATUS="$(python3 -c 'import json; print(json.load(open("manifest.json"))["release_status"])')"
          if [ "$STATUS" = "beta-rc" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run package gates
        run: ./scripts/validate-all.sh --strict

      - name: Generate release notes
        id: notes
        run: |
          # Extract changelog section for this version
          VERSION="${{ steps.version.outputs.VERSION }}"
          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | head -n -1 >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create distribution archive and checksum
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          bash scripts/package-release.sh "$VERSION" "$GITHUB_WORKSPACE/dist"

      - name: Smoke-test distribution archive
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          bash scripts/smoke-release.sh "$GITHUB_WORKSPACE/dist/quinotospec-${VERSION}.tar.gz"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: QuinotoSpec v${{ steps.version.outputs.VERSION }}
          body: |
            ## QuinotoSpec v${{ steps.version.outputs.VERSION }}
            
            ${{ steps.notes.outputs.NOTES }}
            
            ---
            
            ### Installation
            
            ```bash
            # Clone
            git clone https://github.com/Quinoto-Tech/QuinotoSpec.git
            cd QuinotoSpec
            
            # Install for your IDE
             ./install.sh --opencode --global   # OpenCode
             ./install.sh --cursor --global     # Cursor
             ./install.sh --claude --global     # Claude Code
             ./install.sh --cline --global      # Cline
            ./install.sh --antigravity --global # Antigravity
            ```
          files: |
            dist/quinotospec-${{ steps.version.outputs.VERSION }}.tar.gz
            dist/quinotospec-${{ steps.version.outputs.VERSION }}.tar.gz.sha256
          draft: false
          prerelease: ${{ steps.release.outputs.prerelease }}
