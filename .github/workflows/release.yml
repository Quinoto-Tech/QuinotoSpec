name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Verify tag matches package version
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          VERSION_FILE="$(tr -d '[:space:]' < .version)"
          MANIFEST_VERSION="$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")"
          INSTALLER_VERSION="$(grep -o 'INSTALLER_VERSION="[0-9.]*"' install.sh | cut -d'"' -f2)"

          echo "Tag: $VERSION | .version: $VERSION_FILE | manifest.json: $MANIFEST_VERSION | install.sh: $INSTALLER_VERSION"

          FAIL=0
          if [ "$VERSION" != "$VERSION_FILE" ]; then
            echo "ERROR: tag v$VERSION != .version ($VERSION_FILE)"
            FAIL=1
          fi
          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "ERROR: tag v$VERSION != manifest.json version ($MANIFEST_VERSION)"
            FAIL=1
          fi
          if [ "$VERSION" != "$INSTALLER_VERSION" ]; then
            echo "ERROR: tag v$VERSION != install.sh INSTALLER_VERSION ($INSTALLER_VERSION)"
            FAIL=1
          fi
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md has no entry for $VERSION — run scripts/update-version.sh first"
            FAIL=1
          fi
          exit $FAIL

      - name: Run tests
        run: ./tests/run-all-tests.sh

      - name: Validate package
        run: ./scripts/validate-all.sh

      - name: Generate release notes
        id: notes
        run: |
          # Extract changelog section for this version
          VERSION="${{ steps.version.outputs.VERSION }}"
          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | head -n -1 >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create distribution archive
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          tar -czf "quinotospec-${VERSION}.tar.gz" \
            agent-dist/ \
            install.sh \
            AGENTS.md \
            README.md \
            LICENSE \
            CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: QuinotoSpec v${{ steps.version.outputs.VERSION }}
          body: |
            ## QuinotoSpec v${{ steps.version.outputs.VERSION }}
            
            ${{ steps.notes.outputs.NOTES }}
            
            ---
            
            ### Installation
            
            ```bash
            # Clone
            git clone https://github.com/Quinoto-Tech/QuinotoSpec.git
            cd QuinotoSpec
            
            # Install for your IDE
            ./install.sh --opencode --global   # OpenCode
            ./install.sh --cursor --global     # Cursor
            ./install.sh --cline --global      # Cline
            ./install.sh --antigravity --global # Antigravity
            ```
          files: quinotospec-${{ steps.version.outputs.VERSION }}.tar.gz
          draft: false
          prerelease: false
