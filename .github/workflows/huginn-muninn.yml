name: Huginn & Muninn — Entropy Watch

on:
  pull_request:
  push:
    branches: [master, main]
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC diario
  workflow_dispatch:

jobs:
  entropy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate (internal only)
        run: bash scripts/validate-all.sh --strict 2>&1 | head -n 100 || true

      - name: Run Huginn & Muninn
        run: bash agent-dist/skills/quinotospec-huginn-muninn/check.sh --json | tee /tmp/entropy.json

      - name: Gate — block if critical
        run: |
          S=$(grep -o '"S_final": [0-9.]*' /tmp/entropy.json | cut -d' ' -f2)
          echo "S_final=$S"
          # Demo gate: fail if >=0.76 (usar bc/python para float real)
          python3 -c "import sys,json; d=json.load(open('/tmp/entropy.json')); sys.exit(1 if d['S_final']>=0.76 else 0)" || {
            echo "::error::S_final critico >=0.76 — ejecutar @quinotospec.tiwaz-rune y @quinotospec.mjolnir-refactor"
            exit 1
          }
